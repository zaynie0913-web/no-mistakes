name: 屠龙克克推送

on:
  schedule:
    # 工作日早安 07:30 北京 = 23:30 UTC (周日-周四)
    - cron: '30 23 * * 0-4'
    # 周末早安 08:30 北京 = 00:30 UTC (周五-周六 → 周六-周日早上)
    - cron: '30 0 * * 5-6'
    # 午饭 12:00 北京 = 04:00 UTC (每天)
    - cron: '0 4 * * *'
    # 下午 17:30 北京 = 09:30 UTC (每天)
    - cron: '30 9 * * *'
    # 晚安 22:30 北京 = 14:30 UTC (每天)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: '消息分类 (morning/lunch/afternoon/night/bonus/study_reminder)'
        required: false
        default: 'bonus'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine category
        id: cat
        run: |
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            "30 23 * * 0-4") CAT=morning ;;
            "30 0 * * 5-6")  CAT=morning ;;
            "0 4 * * *")     CAT=lunch ;;
            "30 9 * * *")    CAT=afternoon ;;
            "30 14 * * *")   CAT=night ;;
            *)               CAT="${{ github.event.inputs.category || 'bonus' }}" ;;
          esac
          echo "category=$CAT" >> $GITHUB_OUTPUT

      - name: Send notification
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: node keke-push/send.js "${{ steps.cat.outputs.category }}"
